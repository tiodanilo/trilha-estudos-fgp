<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo Dirigido – Aulas 8 a 12</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
/* Layout: faixa preta de "trilha" (linha de estações, como um mapa de metrô em amarelo FGP) fixa no topo;
   cada estação abre em 3 etapas sequenciais (Ler → Memorizar → Treinar) com um botão "Continuar". */
:root{
  --night:#111214; --night-2:#1d1f23; --yellow:#f7c600; --yellow-deep:#e0b200;
  --ink:#16181b; --paper:#fbfbf8; --panel:#ffffff; --line:#e3e3dd; --muted:#62666e; --soft:#fff4c2;
  --ok:#17784a; --ok-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe8e6;
  --display:"Bricolage Grotesque", "Arial Black", Arial, sans-serif;
  --body:"Source Sans 3", "Segoe UI", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eeeeea; --paper:#141517; --panel:#1c1e21; --line:#2f3237; --muted:#a4a8af; --soft:#3a3212;
    --ok:#69c891; --ok-soft:#14301f; --bad:#f08b81; --bad-soft:#3b1b18; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eeeeea; --paper:#141517; --panel:#1c1e21; --line:#2f3237; --muted:#a4a8af; --soft:#3a3212;
  --ok:#69c891; --ok-soft:#14301f; --bad:#f08b81; --bad-soft:#3b1b18; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
button{font:inherit;color:inherit}

/* ---------- faixa da trilha ---------- */
.band{background:var(--night);color:#f4f4f0;position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--yellow)}
.band-in{max-width:1080px;margin:0 auto;padding:14px clamp(16px,4vw,32px) 0;display:flex;align-items:center;gap:16px}
.logo{height:40px;width:auto;border-radius:2px;display:block}
.band h1{font-family:var(--display);font-weight:800;font-size:18px;margin:0;line-height:1.1}
.band small{display:block;color:#b9bbc0;font-size:13px}
.pct{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.pct b{font-family:var(--display);font-size:26px;color:var(--yellow);line-height:1}
.pct span{display:block;font-size:12px;color:#b9bbc0}
.trail-wrap{max-width:1080px;margin:0 auto;padding:10px clamp(16px,4vw,32px) 14px;overflow-x:auto}
.trail{display:flex;align-items:flex-start;min-width:640px;position:relative}
.trail::before{content:"";position:absolute;left:22px;right:22px;top:21px;height:6px;background:#3a3d43;border-radius:3px}
.trail .fill{position:absolute;left:22px;top:21px;height:6px;background:var(--yellow);border-radius:3px;width:0}
.st{all:unset;cursor:pointer;flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;z-index:1;text-align:center}
.st .dot{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;
  background:var(--night);border:5px solid #3a3d43;color:#f4f4f0}
.st.started .dot{border-color:var(--yellow)}
.st.done .dot{background:var(--yellow);border-color:var(--yellow);color:var(--night)}
.st.here .dot{box-shadow:0 0 0 5px rgba(247,198,0,.35);transform:scale(1.08)}
.st .lb{font-size:12px;font-weight:600;color:#c9cbd0;line-height:1.2;max-width:110px}
.st.here .lb{color:var(--yellow)}
.st:focus-visible .dot{outline:3px solid #fff;outline-offset:3px}

/* ---------- conteúdo ---------- */
main{max-width:1080px;margin:0 auto;padding:30px clamp(16px,4vw,32px) 70px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.04em;color:var(--muted);margin:0 0 4px}
h2{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,46px);line-height:1.02;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
h2 em{font-style:normal;background:linear-gradient(transparent 58%, var(--yellow) 58%);padding:0 2px}
.lead{color:var(--muted);max-width:65ch;margin:0 0 22px;font-size:18px}
h3{font-family:var(--display);font-weight:800;font-size:22px;margin:30px 0 12px}

/* passos da estação */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 24px}
.step{all:unset;cursor:pointer;border-radius:12px;padding:12px 14px;background:var(--panel);border:2px solid var(--line);display:flex;gap:10px;align-items:center}
.step .sn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:15px;background:var(--line);flex:none}
.step .st-t{font-weight:700;line-height:1.15}
.step .st-s{font-size:13px;color:var(--muted)}
.step.seen .sn{background:var(--ink);color:var(--paper)}
.step[aria-current="step"]{border-color:var(--ink);background:var(--soft)}
.step[aria-current="step"] .sn{background:var(--yellow);color:var(--night)}

/* resumo */
.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;counter-reset:c}
.concept{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;position:relative}
.concept::before{counter-increment:c;content:counter(c, decimal-leading-zero);font-family:var(--display);font-weight:800;font-size:13px;
  background:var(--yellow);color:var(--night);padding:3px 8px;border-radius:6px;display:inline-block;margin-bottom:8px}
.concept h4{font-family:var(--display);font-weight:800;font-size:18px;margin:0 0 6px;line-height:1.2}
.concept p,.concept div{margin:0}
.concept ul,.concept ol{margin:6px 0 0;padding-left:20px}
.concept.wide{grid-column:1/-1}
.authors{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;align-items:center}
.authors b{font-size:14px;color:var(--muted);margin-right:4px}
.chip{background:var(--night);color:#f4f4f0;border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}

/* cartões */
.flash{perspective:1400px;max-width:720px}
.fc{all:unset;cursor:pointer;display:block;width:100%;height:260px;position:relative;transform-style:preserve-3d}
.fc .side{position:absolute;inset:0;border-radius:18px;padding:26px 28px;display:flex;flex-direction:column;justify-content:center;backface-visibility:hidden}
.fc .front{background:var(--night);color:#f6f6f2}
.fc .back{background:var(--yellow);color:var(--night);transform:rotateY(180deg)}
.fc.flipped{transform:rotateY(180deg)}
.fc .tagl{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:10px}
.fc .front .txt{font-family:var(--display);font-weight:800;font-size:clamp(20px,3vw,27px);line-height:1.2;text-wrap:balance}
.fc .back .txt{font-size:19px;line-height:1.45;font-weight:600}
.fc .hint{position:absolute;right:22px;bottom:16px;font-size:13px;opacity:.7}
.dots{display:flex;gap:6px;margin:14px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
@media (prefers-reduced-motion:no-preference){ .fc{transition:transform .5s cubic-bezier(.3,.7,.2,1)} .st .dot{transition:transform .2s} }

/* treino: uma questão por vez */
.quiz{max-width:760px}
.qhead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qbar{flex:1;height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--yellow);width:0}
.qcount{font-family:var(--display);font-weight:800;font-variant-numeric:tabular-nums}
.qcard{background:var(--panel);border:2px solid var(--ink);border-radius:18px;padding:22px}
.stem{font-family:var(--display);font-weight:800;font-size:21px;line-height:1.25;margin:0 0 6px}
.multi{font-size:14px;color:var(--muted);font-weight:600;margin:0 0 10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-top:8px;cursor:pointer;background:var(--paper)}
.opt:hover{border-color:var(--ink)}
.opt input{margin-top:5px;width:18px;height:18px;accent-color:var(--night);flex:none}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.fb{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:16px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.no{background:var(--bad-soft);color:var(--bad)}
.fb span{color:var(--ink)}
.result{background:var(--night);color:#f4f4f0;border-radius:18px;padding:26px;max-width:760px}
.result .big{font-family:var(--display);font-weight:800;font-size:56px;color:var(--yellow);line-height:1}
.result p{margin:8px 0 0;color:#cfd1d5}
.result .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

/* botões e navegação */
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:16px;border:2px solid var(--ink);background:transparent}
.btn:hover{background:var(--soft)}
.btn.go{background:var(--yellow);border-color:var(--yellow);color:var(--night)}
.btn.go:hover{background:var(--yellow-deep);border-color:var(--yellow-deep)}
.btn.light{border-color:#f4f4f0;color:#f4f4f0}
.btn.light:hover{background:#2a2c31}
.pager{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:34px;padding-top:18px;border-top:2px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* início */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center}
.hero h2{font-size:clamp(36px,6vw,60px)}
.how{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.how li{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.how .k{font-family:var(--display);font-weight:800;background:var(--yellow);color:var(--night);border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center}
.how b{display:block}
.how span{color:var(--muted);font-size:15px}
.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.sta{all:unset;cursor:pointer;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.sta:hover{border-color:var(--ink)}
.sta .n{font-family:var(--display);font-weight:800;font-size:34px;line-height:1}
.sta .t{font-weight:700;line-height:1.2}
.sta .s{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sta.done{border-color:var(--yellow);background:var(--soft)}
.note{background:var(--soft);border-radius:12px;padding:12px 16px;max-width:65ch;font-size:15px}
textarea{width:100%;min-height:100px;font:inherit;font-size:16px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);resize:vertical}
textarea:focus{border-color:var(--ink);outline:none}
label.ta{display:block;font-family:var(--display);font-weight:800;margin:18px 0 6px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;background:var(--panel);max-width:760px}
.check input{margin-top:4px;width:20px;height:20px;accent-color:var(--night);flex:none}
.check.done{border-color:var(--yellow);background:var(--soft)}
.ta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.ta-row .wc{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.review{margin-top:10px;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
.review h5{font-family:var(--display);font-weight:800;font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:10px}
.review .grade{background:var(--night);color:var(--yellow);border-radius:999px;padding:2px 10px;font-size:14px}
.review ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.review li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.review li .ic{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800}
.review li.yes .ic{background:var(--ok-soft);color:var(--ok)}
.review li.no .ic{background:var(--bad-soft);color:var(--bad)}
.review li.warn .ic{background:var(--soft);color:var(--ink)}
.review .disc{font-size:13px;color:var(--muted);margin:10px 0 0}
.copied{font-size:14px;color:var(--ok);font-weight:600}
.dblock{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:6px 20px 18px;margin-top:18px;max-width:820px}
.dblock h3{margin:16px 0 6px}
.sq{margin-top:12px}
.sq label{display:block;font-weight:700;margin-bottom:6px}
.sq-row{display:flex;gap:8px;flex-wrap:wrap}
.sq-row input,.pill-in{flex:1;min-width:220px;font:inherit;font-size:16px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);color:var(--ink)}
.sq-row input:focus,.pill-in:focus{border-color:var(--ink);outline:none}
.pill-in{flex:0 1 260px;border-radius:999px}
.sq-fb .fb{margin-top:8px;font-size:15px}
.linkbtn{all:unset;cursor:pointer;text-decoration:underline;font-weight:600;color:var(--ink);margin-left:6px;font-size:14px}
.model{margin-top:8px;color:var(--ink);font-style:italic}
.mont{margin-top:16px;border-top:2px dashed var(--line);padding-top:12px}
.mont summary{cursor:pointer;font-family:var(--display);font-weight:800}
.mtext{margin:10px 0 0;background:var(--soft);border-radius:12px;padding:12px 14px}
.score-hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:24px;align-items:center;background:var(--night);color:#f4f4f0;border-radius:20px;padding:24px 26px;margin-top:8px}
.sh-n{display:flex;flex-direction:column;align-items:center}
.sh-n .big{font-family:var(--display);font-weight:800;font-size:76px;line-height:.9;color:var(--yellow);font-variant-numeric:tabular-nums}
.sh-n .of{font-size:14px;color:#b9bbc0}
.lvl{display:inline-block;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.sh-t p{margin:6px 0 0;color:#d4d6da;max-width:52ch}
.sh-t .partial{font-size:14px;color:#b9bbc0}
.scale{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-width:170px}
.scale li{display:flex;justify-content:space-between;gap:12px;padding:5px 10px;border-radius:8px;font-size:14px;color:#b9bbc0}
.scale li b{font-weight:700}
.scale li.on{background:var(--yellow);color:var(--night)}
.rtable{display:grid;gap:8px;max-width:820px}
.rrow{all:unset;cursor:pointer;display:grid;grid-template-columns:40px minmax(0,1fr) 180px 80px;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 14px}
.rrow:hover{border-color:var(--ink)}
.rn{font-family:var(--display);font-weight:800;font-size:18px}
.rt{font-weight:700}
.rb{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.rb i{display:block;height:100%;background:var(--yellow)}
.rv{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
.todo{max-width:65ch;padding-left:20px;margin:0}
.todo li{margin-bottom:6px}
@media (max-width:760px){ .score-hero{grid-template-columns:1fr} .rrow{grid-template-columns:32px minmax(0,1fr) 64px} .rb{display:none} }
footer{color:var(--muted);font-size:14px;max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,32px) 30px}
@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .band{position:static}
  .steps{grid-template-columns:repeat(3,1fr);gap:6px}
  .step{flex-direction:column;align-items:flex-start;gap:6px;padding:10px}
  .step .st-s{display:none}
  .band small,.pct span{display:none}
  .fc{height:300px}
}
</style>
</head>

{ id:"aula-8", n:8, titulo:"Software educacional",
  lead:"Como o professor analisa e escolhe um software. Leia também o capítulo \"Software educacional\": parte do conteúdo está só nele.",
  resumo:[
   ["Software educacional","Programa usado com intenção pedagógica. Além de apoiar o ensino e a aprendizagem, pode colaborar com o desenvolvimento integral do estudante."],
   ["Modelo TUP (Bednarik, 2004)","A sigla vem de <i>Technology, Usability and Pedagogy</i>: o software é avaliado em três grandes áreas, tecnologia, usabilidade e pedagogia. Três elementos foram destacados em aula:<ul><li><b style='display:inline'>Acessibilidade:</b> atende usuários com perfis e necessidades diferentes.</li><li><b style='display:inline'>Estética e áudio:</b> layout e interface compreensíveis e agradáveis, com bom uso de textos, imagens, animações e som.</li><li><b style='display:inline'>Motivação:</b> desperta o interesse do aluno para que cumpra os objetivos; pode usar recompensas.</li></ul>"],
   ["O professor como avaliador","Antes de usar um software, o professor o analisa criticamente: serve para a idade da turma? Conversa com o currículo e com a proposta da escola? Como os alunos interagem com ele? A tecnologia sozinha não garante aprendizagem."],
   ["Quatro habilidades docentes","Tecnológica, de avaliação, de mediação e de jogar."],

   ["Quais os três elementos do modelo TUP destacados em aula?","Acessibilidade, estética e áudio, e motivação."],
   ["No modelo TUP, o que é acessibilidade?","A capacidade de o programa atender usuários com perfis e necessidades diferentes."],
   ["Quais são as quatro habilidades docentes para trabalhar com softwares?","Tecnológica, de avaliação, de mediação e de jogar."],

{ id:"aula-9", n:9, titulo:"Objetos de aprendizagem",
  lead:"O que é um objeto de aprendizagem (OA), como ele entra no planejamento e o que considerar ao escolher um.",
  resumo:[
   ["Objeto de aprendizagem (OA)","Recurso pedagógico digital que facilita a aprendizagem ao promover a interação entre o aluno e o conteúdo. Pode introduzir, aprofundar ou sistematizar um conteúdo."],
   ["Tipos","Imagens, vídeos, animações e jogos."],
   ["Um meio, não um fim","O OA não substitui o professor nem o planejamento. O uso começa no plano de aula, e na escolha os aspectos pedagógicos e técnicos são igualmente importantes."],
   ["Planejamento de uso","Nome do OA, conteúdo, objetivo, justificativa e link. Exemplos da aula: \"Teste de Einstein\" (raciocínio lógico, no Racha Cuca) e \"Contexto\" (vocabulário e associação de ideias)."],
   ["Cinco dimensões pedagógicas (Braga e Menezes, 2014)","<ul><li><b style='display:inline'>Interatividade:</b> possibilidade de o aluno interagir com o OA.</li><li><b style='display:inline'>Autonomia:</b> possibilidade de tomar decisões.</li><li><b style='display:inline'>Cooperação:</b> trabalho coletivo e troca de informações.</li><li><b style='display:inline'>Cognição:</b> possibilidade de desenvolvimento intelectual.</li><li><b style='display:inline'>Afetividade:</b> sentimentos e motivação ao usar o OA.</li></ul>"],
   ["Repositórios","Bancos onde os OAs ficam organizados e catalogados, facilitando a busca e a reutilização: Escola Games, Kahoot!, Wayground (antigo Quizizz), Ludo Educativo, Matific, Smartkids, Racha Cuca, Khan Academy, PhET, Nova Escola, Educacross e Wordwall."],
   ["Avaliação","O professor planeja como vai avaliar os alunos durante o uso do OA e como vai dar retorno sobre as atividades."]

  autores:"Braga e Menezes (2014)",

   ["Cooperação (Braga e Menezes)","Trabalho coletivo e troca de informações entre alunos e com o professor."],
   ["Cognição (Braga e Menezes)","Possibilidade de desenvolvimento intelectual."],
   ["Afetividade (Braga e Menezes)","Sentimentos e motivação dos alunos ao usar o OA."],

const STEPS = [["Ler","o resumo"],["Memorizar","com os cartões"],["Treinar","com questões"]];
const store = {
  get(k,d){ try{ const v = localStorage.getItem("fgp-trilha-"+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem("fgp-trilha-"+k, JSON.stringify(v)); }catch(e){} }
};
let results = store.get("results", {});   // {aula-8:{0:true}}

let stepOf = {};                          // passo atual por aula, só na sessão
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STATIONS = [...AULAS.map(a=>({id:a.id, dot:a.n, lb:a.titulo})), {id:"discursiva",dot:"D",lb:"Discursiva"}, {id:"resultado",dot:"★",lb:"Seu resultado"}];

function score(a){ const r = results[a.id]||{}; return {done:Object.keys(r).length, ok:Object.values(r).filter(Boolean).length, total:a.qs.length}; }
function stState(id){
  const a = AULAS.find(x=>x.id===id);
  if(a){ const s = score(a); if(s.done===s.total) return "done"; return (s.done||(seen[id]||[]).length)?"started":""; }
  if(id==="discursiva"){ const d = store.get("short",{}); const n = DISC.reduce((acc,r,i)=>acc+r.qs.filter((q,j)=>words(d[i+"-"+j]||"")>=4).length,0); const tot = DISC.reduce((a,r)=>a+r.qs.length,0); return n>=tot?"done":(n?"started":""); }
  if(id==="resultado"){ const r = grade(); return r.complete?"done":(r.answered?"started":""); }
  return "";
}
function renderTrail(cur){
  const states = STATIONS.map(s=>stState(s.id));
  const doneN = states.filter(x=>x==="done").length;
  document.getElementById("pct").textContent = Math.round(doneN/STATIONS.length*100)+"%";
  let lastDone = -1; states.forEach((s,i)=>{ if(s==="done") lastDone=i; });
  const t = document.getElementById("trail");
  t.innerHTML = `<i class="fill" style="width:calc(${lastDone<0?0:lastDone/(STATIONS.length-1)*100}% - ${lastDone<0?0:44*lastDone/(STATIONS.length-1)}px)"></i>` +
    STATIONS.map((s,i)=>`<button class="st ${states[i]} ${cur===s.id?"here":""}" data-go="${s.id}" ${cur===s.id?'aria-current="page"':''} title="${esc(s.lb)}"><span class="dot">${s.dot}</span><span class="lb">${esc(s.lb)}</span></button>`).join("");
  t.querySelectorAll(".st").forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){ if(location.hash.slice(1)===id) route(); else location.hash = id; }
function nextStation(id){ const i = STATIONS.findIndex(s=>s.id===id); return STATIONS[i+1]; }

/* ---------- início ---------- */
function renderInicio(){
  const sts = STATIONS.map((s,i)=>{
    const a = AULAS.find(x=>x.id===s.id); const st = stState(s.id);
    let sub = a ? `${a.cards.length} cartões · ${a.qs.length} questões` : (s.id==="discursiva"?"Respostas curtas":"Nota e classificação");
    if(a){ const sc = score(a); if(sc.done) sub = `Acertou ${sc.ok} de ${sc.total}`; }
    return `<button class="sta ${st}" data-go="${s.id}"><span class="n">${s.dot}</span><span class="t">${a?"Aula "+a.n+" · ":""}${esc(s.lb)}</span><span class="s">${st==="done"?"Concluída · ":st==="started"?"Em andamento · ":""}${sub}</span></button>`;
  }).join("");
  const first = STATIONS.find(s=>stState(s.id)!=="done") || STATIONS[0];
  return `<section class="hero">
    <div><p class="eyebrow">2ª Avaliação Bimestral</p>
    <h2>Siga a trilha, <em>estação por estação</em></h2>
    <p class="lead">A prova cobre as Aulas 8 a 12: dez questões objetivas e uma discursiva. Cada aula é uma estação com três etapas. No fim, você treina a discursiva e recebe uma nota com a sua classificação de preparo.</p>
    <div class="row"><button class="btn go" data-go="${first.id}">${stState(first.id)?"Continuar":"Começar"} pela ${first.id.startsWith("aula")?"Aula "+first.dot:esc(first.lb)} →</button></div></div>
    <ol class="how">
      <li><span class="k">1</span><div><b>Ler</b><span>O resumo dos conceitos e autores da aula.</span></div></li>
      <li><span class="k">2</span><div><b>Memorizar</b><span>Cartões: tente responder antes de virar.</span></div></li>
      <li><span class="k">3</span><div><b>Treinar</b><span>Questões com correção e explicação na hora.</span></div></li>
    </ol></section>
  <h3>As estações</h3><div class="stations">${sts}</div>
  <h3>Antes de começar</h3>
  <p class="note">O resumo não substitui os slides e o capítulo do livro de cada aula. Seu progresso fica salvo só neste navegador: em outro aparelho, a trilha começa do zero.</p>`;
}

/* ---------- estação de aula ---------- */
function renderAula(a){
  const step = stepOf[a.id] ?? 0;
  seen[a.id] = [...new Set([...(seen[a.id]||[]), step])]; store.set("seen", seen);
  const idx = STATIONS.findIndex(s=>s.id===a.id);
  const steps = STEPS.map(([t,s],i)=>`<button class="step ${(seen[a.id]||[]).includes(i)?"seen":""}" data-step="${i}" ${i===step?'aria-current="step"':''}><span class="sn">${i+1}</span><span><span class="st-t">${t}</span><br><span class="st-s">${s}</span></span></button>`).join("");
  let body = "";
  if(step===0){
    body = `<div class="concepts">${a.resumo.map(([t,d])=>`<article class="concept ${d.length>420?"wide":""}"><h4>${t}</h4><div>${d}</div></article>`).join("")}</div>
      <div class="authors"><b>Autores para lembrar</b>${a.autores.split(" · ").map(x=>`<span class="chip">${x}</span>`).join("")}</div>`;
  } else if(step===1){
    body = `<div class="flash"><button class="fc" id="fc" aria-live="polite"></button><div class="dots" id="dots"></div>
      <div class="row"><button class="btn" id="prev">← Anterior</button><button class="btn" id="flip">Virar cartão</button><button class="btn go" id="next">Próximo cartão →</button></div></div>`;
  } else {
    body = `<div id="quiz"></div>`;
  }
  const nx = nextStation(a.id);
  const back = step>0 ? `<button class="btn" data-stepgo="${step-1}">← ${STEPS[step-1][0]}</button>` : `<button class="btn" data-go="${idx>0?STATIONS[idx-1].id:"inicio"}">← ${idx>0?"Estação anterior":"Início"}</button>`;
  const fwd = step<2 ? `<button class="btn go" data-stepgo="${step+1}">Continuar: ${STEPS[step+1][0]} →</button>` : `<button class="btn go" data-go="${nx.id}">Próxima estação: ${nx.id.startsWith("aula")?"Aula "+nx.dot:esc(nx.lb)} →</button>`;
  return `<p class="eyebrow">Estação ${idx+1} de ${STATIONS.length} · Aula ${a.n}</p><h2>${a.titulo}</h2><p class="lead">${a.lead}</p>
    <div class="steps" role="tablist" aria-label="Etapas">${steps}</div>${body}
    <div class="pager">${back}${fwd}</div>`;
}
function bindAula(a){
  const step = stepOf[a.id] ?? 0;
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{ stepOf[a.id]=+b.dataset.step; route(); });
  document.querySelectorAll("[data-stepgo]").forEach(b=>b.onclick=()=>{ stepOf[a.id]=+b.dataset.stepgo; route(); });
  if(step===1) bindCards(a);
  if(step===2) drawQuiz(a);
}
function bindCards(a){
  let k=0, fl=false; const fc=document.getElementById("fc");
  const draw=()=>{ const [f,b]=a.cards[k];
    fc.classList.toggle("flipped",fl);
    fc.innerHTML=`<span class="side front"><span class="tagl">Pergunta ${k+1} de ${a.cards.length}</span><span class="txt">${f}</span><span class="hint">Clique para virar</span></span><span class="side back"><span class="tagl">Resposta</span><span class="txt">${b}</span><span class="hint">Clique para voltar</span></span>`;
    document.getElementById("dots").innerHTML=a.cards.map((_,i)=>`<i class="${i===k?"on":""}"></i>`).join(""); };
  fc.onclick=()=>{fl=!fl;fc.classList.toggle("flipped",fl);};
  document.getElementById("flip").onclick=fc.onclick;
  document.getElementById("next").onclick=()=>{k=(k+1)%a.cards.length;fl=false;draw();};
  document.getElementById("prev").onclick=()=>{k=(k-1+a.cards.length)%a.cards.length;fl=false;draw();};
  draw();
}
function drawQuiz(a){
  const box=document.getElementById("quiz"); const r=results[a.id]||{};
  const i=a.qs.findIndex((_,j)=>!(j in r));
  const sc=score(a);
  if(i<0){
    box.innerHTML=`<div class="result"><div class="big">${sc.ok}/${sc.total}</div><p>${sc.ok===sc.total?"Estação concluída sem erros.":sc.ok>=sc.total-1?"Estação concluída. Releia a explicação do que errou.":"Estação concluída. Vale voltar ao resumo antes de seguir."}</p>
      <div class="row"><button class="btn light" id="redo">Refazer as questões</button><button class="btn light" id="toread">Voltar ao resumo</button></div></div>`;
    document.getElementById("redo").onclick=()=>{delete results[a.id];store.set("results",results);drawQuiz(a);renderTrail(a.id);};
    document.getElementById("toread").onclick=()=>{stepOf[a.id]=0;route();};
    return;
  }
  const q=a.qs[i], multi=q.a.length>1, type=multi?"checkbox":"radio";
  box.innerHTML=`<div class="quiz"><div class="qhead"><span class="qcount">${i+1}/${a.qs.length}</span><div class="qbar"><i style="width:${Math.round(i/a.qs.length*100)}%"></i></div><span class="qcount">✓ ${sc.ok}</span></div>
    <div class="qcard"><p class="stem">${esc(q.t)}</p>${multi?'<p class="multi">Marque todas as corretas</p>':""}
    ${q.o.map((o,j)=>`<label class="opt" for="o${j}"><input type="${type}" name="q" id="o${j}" value="${j}"><span>${esc(o)}</span></label>`).join("")}
    <div id="fb"></div><div class="row" style="margin-top:14px"><button class="btn go" id="conf">Conferir</button></div></div></div>`;
  document.getElementById("conf").onclick=()=>{
    const ch=[...box.querySelectorAll("input:checked")].map(x=>+x.value); const fb=document.getElementById("fb");
    if(!ch.length){ fb.innerHTML=`<div class="fb no">Escolha uma alternativa antes de conferir.</div>`; return; }
    const ok=ch.length===q.a.length && ch.every(c=>q.a.includes(c));
    box.querySelectorAll(".opt").forEach((el,j)=>{ el.classList.toggle("right",q.a.includes(j)); el.classList.toggle("wrong",ch.includes(j)&&!q.a.includes(j)); el.querySelector("input").disabled=true; });
    fb.innerHTML=`<div class="fb ${ok?"ok":"no"}"><strong>${ok?"Acertou!":"Ainda não."}</strong> <span>${esc(q.e)}</span></div>`;
    results[a.id]=results[a.id]||{}; results[a.id][i]=ok; store.set("results",results); renderTrail(a.id);
    const btn=document.getElementById("conf"); btn.textContent = i+1<a.qs.length?"Próxima questão →":"Ver resultado →"; btn.onclick=()=>drawQuiz(a);
  };
}

function checkShort(q, txt){
  const t = txt.toLowerCase(); const n = words(txt);
  if(n<4) return {ok:false, msg:"Escreva uma frase completa (pelo menos 4 palavras)."};
  const miss = q.need.filter(g=>!g.some(k=>t.includes(k)));
  return miss.length ? {ok:false, msg:"Quase. "+q.tip} : {ok:true, msg:"Boa! Tem o essencial."};
}
function para(i){
  const d=store.get("short",{});
  return DISC[i].qs.map((q,j)=>{ let x=(d[i+"-"+j]||"").trim(); if(!x) return "";
    if(j===0 && /^(é|são|permite|pode|serve|ajuda)\b|^(é|são)\s/i.test(x)) x = DISC[i].subj+" "+x[0].toLowerCase()+x.slice(1);
    x=x[0].toUpperCase()+x.slice(1); return /[.!?]$/.test(x)?x:x+"."; }).filter(Boolean).join(" ");
}
function renderDiscursiva(){
  const d=store.get("short",{}); const idx=STATIONS.findIndex(s=>s.id==="discursiva");
  const blocks = DISC.map((r,i)=>`<section class="dblock"><h3>${i+1}. ${r.r}</h3>
    ${r.qs.map((q,j)=>`<div class="sq"><label for="s${i}-${j}">${q.p}</label>
      <div class="sq-row"><input id="s${i}-${j}" type="text" value="${esc(d[i+"-"+j]||"")}" placeholder="Responda em uma frase" autocomplete="off">
      <button class="btn" data-chk="${i}-${j}">Conferir</button></div>
      <div class="sq-fb" id="f${i}-${j}"></div></div>`).join("")}
    <details class="mont" id="m${i}"><summary>Ver meu parágrafo montado</summary><p class="mtext" id="p${i}"></p><p class="disc" style="font-size:14px;color:var(--muted);margin:8px 0 0">Na prova, ligue as frases com conectivos (por exemplo, "por isso", "como no caso de") para formar um texto corrido.</p></details></section>`).join("");
  return `<p class="eyebrow">Estação ${idx+1} de ${STATIONS.length}</p><h2>Discursiva em <em>frases curtas</em></h2>
  <p class="lead">Na prova, você vai explicar como cada recurso contribui para a aprendizagem, com um exemplo visto em aula. Aqui, responda em uma frase cada pergunta. A página confere na hora e, no fim de cada recurso, junta suas frases no parágrafo da discursiva.</p>
  ${blocks}
  <h3>Enviar para o professor</h3>
  <p class="lead" style="margin-bottom:10px">Copie seus parágrafos montados e cole onde o professor pedir (e-mail, AVA ou grupo da turma).</p>
  <div class="row"><input id="nome" type="text" placeholder="Seu nome" class="pill-in" value="${esc(store.get("nome",""))}"><button class="btn go" id="copy">Copiar minhas respostas</button><span id="copied" class="copied" aria-live="polite"></span></div>
  <textarea id="copybox" readonly style="display:none;margin-top:10px;min-height:180px"></textarea>
  <p class="note" style="margin-top:16px">A conferência procura as ideias-chave de cada resposta; não corrige a gramática. Na prova, escreva na norma-padrão: erros de português descontam pontos. Suas respostas ficam salvas só neste navegador.</p>
  <div class="pager"><button class="btn" data-go="aula-12">← Aula 12</button><button class="btn go" data-go="resultado">Última estação: seu resultado →</button></div>`;
}
function bindDiscursiva(){
  const showFb=(i,j,reveal)=>{ const q=DISC[i].qs[j], v=document.getElementById(`s${i}-${j}`).value, r=checkShort(q,v), el=document.getElementById(`f${i}-${j}`);
    el.innerHTML = `<div class="fb ${r.ok?"ok":"no"}"><strong>${r.ok?"✓":"!"}</strong> <span>${esc(r.msg)}</span> <button class="linkbtn" data-model="${i}-${j}">Ver resposta-modelo</button><div class="model" id="mo${i}-${j}" ${reveal?"":"hidden"}>Modelo: ${esc(q.m)}</div></div>`;
    el.querySelector("[data-model]").onclick=()=>{ document.getElementById(`mo${i}-${j}`).hidden=false; };
  };
  const upd=i=>{ document.getElementById("p"+i).textContent = para(i) || "Responda às perguntas acima para montar o parágrafo."; };
  DISC.forEach((r,i)=>{ r.qs.forEach((q,j)=>{ const inp=document.getElementById(`s${i}-${j}`);
      inp.oninput=()=>{ const d=store.get("short",{}); d[i+"-"+j]=inp.value; store.set("short",d); upd(i); renderTrail("discursiva"); };
      inp.onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); showFb(i,j); } };
      if(inp.value.trim()) showFb(i,j); });
    upd(i); });
  document.querySelectorAll("[data-chk]").forEach(b=>b.onclick=()=>{ const [i,j]=b.dataset.chk.split("-").map(Number); showFb(i,j); });
  const nome=document.getElementById("nome"); nome.oninput=()=>store.set("nome",nome.value);
  document.getElementById("copy").onclick=async()=>{
    const txt=`Treino da discursiva – ${nome.value||"(sem nome)"}\n\n`+DISC.map((r,i)=>`${i+1}. ${r.r}\n${para(i)||"(sem resposta)"}`).join("\n\n");
    const msg=document.getElementById("copied"), box=document.getElementById("copybox");
    try{ await navigator.clipboard.writeText(txt); msg.textContent="Copiado! Agora é só colar."; box.style.display="none"; }
    catch(e){ box.value=txt; box.style.display="block"; box.focus(); box.select(); msg.textContent="Selecione o texto abaixo e copie (Ctrl+C)."; }
  };
}
/* ---------- resultado ---------- */
const LEVELS = [
  {min:8.5, t:"Preparado", d:"Você domina o conteúdo das cinco aulas. Revise os erros pontuais e chegue tranquilo à prova."},
  {min:7, t:"Quase lá", d:"Base boa. Revise as aulas com menor aproveitamento e refaça as questões que errou."},
  {min:5, t:"No caminho", d:"Você já sabe parte do conteúdo. Volte ao resumo e aos cartões das aulas mais fracas antes de refazer as questões."},
  {min:0, t:"Começando", d:"Ainda falta bastante. Siga a trilha do início: leia o resumo, passe pelos cartões e faça as questões de cada aula."}
];
function grade(){
  const per = AULAS.map(a=>{ const s=score(a); return {a, ok:s.ok, done:s.done, total:s.total}; });
  const qTot = per.reduce((x,p)=>x+p.total,0), qOk = per.reduce((x,p)=>x+p.ok,0), qDone = per.reduce((x,p)=>x+p.done,0);
  const d = store.get("short",{}); let dTot=0, dOk=0, dDone=0;
  const perD = DISC.map((r,i)=>{ let ok=0, done=0; r.qs.forEach((q,j)=>{ dTot++; const v=d[i+"-"+j]||""; if(words(v)>=4){ done++; dDone++; if(checkShort(q,v).ok){ ok++; dOk++; } } }); return {r:r.r, ok, done, total:r.qs.length}; });
  const nota = 10*(0.7*(qOk/qTot) + 0.3*(dOk/dTot));
  return {per, perD, qTot, qOk, qDone, dTot, dOk, dDone, nota, answered:qDone+dDone, complete:qDone===qTot && dDone===dTot};
}
function renderResultado(){
  const g = grade(); const lv = LEVELS.find(l=>g.nota>=l.min);
  const fmt = n => n.toFixed(1).replace(".",",");
  const weak = g.per.filter(p=>p.done).sort((x,y)=>x.ok/x.total-y.ok/y.total)[0];
  const pending = g.per.filter(p=>p.done<p.total);
  const rows = g.per.map(p=>{ const pc=Math.round(p.ok/p.total*100);
    return `<button class="rrow" data-go="${p.a.id}"><span class="rn">${p.a.n}</span><span class="rt">${p.a.titulo}</span><span class="rb"><i style="width:${pc}%"></i></span><span class="rv">${p.done?`${p.ok}/${p.total}`:"não feita"}</span></button>`; }).join("");
  const dpc = Math.round(g.dOk/g.dTot*100);
  return `<p class="eyebrow">Estação ${STATIONS.length} de ${STATIONS.length}</p><h2>Seu <em>resultado</em></h2>
  <p class="lead">A nota combina as questões de treino das cinco aulas (70%) com as respostas curtas da discursiva (30%). Ela mostra como está o seu preparo e não vale para a média da disciplina.</p>
  <section class="score-hero">
    <div class="sh-n"><span class="big">${fmt(g.nota)}</span><span class="of">de 10</span></div>
    <div class="sh-t"><span class="lvl">${lv.t}</span><p>${lv.d}</p>
      ${!g.complete?`<p class="partial">Nota parcial: você respondeu ${g.qDone} de ${g.qTot} questões e ${g.dDone} de ${g.dTot} respostas curtas. O que falta conta como zero.</p>`:""}
    </div>
    <ol class="scale">${LEVELS.slice().reverse().map(l=>`<li class="${l===lv?"on":""}"><b>${l.t}</b><span>${l.min===0?"0 a 4,9":l.min===5?"5 a 6,9":l.min===7?"7 a 8,4":"8,5 a 10"}</span></li>`).join("")}</ol>
  </section>
  <h3>Por aula</h3><div class="rtable">${rows}
    <button class="rrow" data-go="discursiva"><span class="rn">D</span><span class="rt">Discursiva (respostas curtas)</span><span class="rb"><i style="width:${dpc}%"></i></span><span class="rv">${g.dDone?`${g.dOk}/${g.dTot}`:"não feita"}</span></button></div>
  <h3>O que fazer agora</h3>
  <ul class="todo">
    ${pending.length?`<li>Termine as questões de: ${pending.map(p=>"Aula "+p.a.n).join(", ")}.</li>`:""}
    ${g.dDone<g.dTot?`<li>Responda às perguntas curtas da discursiva que faltam.</li>`:""}
    ${weak && weak.ok<weak.total?`<li>Revise primeiro a <b>Aula ${weak.a.n} · ${weak.a.titulo}</b>, onde seu aproveitamento foi menor, e depois refaça as questões.</li>`:""}
    ${g.dDone && g.dOk<g.dTot?`<li>Na discursiva, compare suas frases com as respostas-modelo das perguntas marcadas com "Quase".</li>`:""}
    ${g.complete && g.nota>=8.5?`<li>Tudo em dia. Na véspera, passe de novo pelos cartões de cada aula.</li>`:""}
  </ul>
  <div class="pager"><button class="btn" data-go="discursiva">← Discursiva</button><button class="btn go" data-go="inicio">Voltar ao início</button></div>`;
}
function route(){
  const h=(location.hash||"").slice(1)||"inicio"; const main=document.getElementById("main");
  const a=AULAS.find(x=>x.id===h); let cur=h;
  if(a){ main.innerHTML=renderAula(a); bindAula(a); }
  else if(h==="discursiva"){ main.innerHTML=renderDiscursiva(); bindDiscursiva(); }
  else if(h==="resultado"){ main.innerHTML=renderResultado(); }
  else { cur="inicio"; main.innerHTML=renderInicio(); }
  main.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
  renderTrail(cur); window.scrollTo(0,0);
}
window.addEventListener("hashchange", route);
route();
